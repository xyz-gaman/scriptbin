<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Scriptbin</title>
<style>
:root{--bg:#0b0d12;--s1:#12151c;--s2:#181c26;--line:#252a37;--text:#eceef4;--mute:#8a92a6;--acc:#7c8cff;--acc2:#b07cff;--ok:#3ddc97;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 420px at 50% -120px,#1d2346 0,transparent 70%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 70px}
.hide{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:13px;font-weight:800}
.tag{font-size:11px;color:var(--acc);border:1px solid var(--acc);padding:3px 8px;border-radius:99px;margin-left:4px}
.top a{color:var(--mute);font-size:14px;text-decoration:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 14px;color:var(--text)}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 6px}
input[type=text],input[type=password],select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:260px;resize:vertical;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:16px;padding:14px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}
.sm{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--s2);color:var(--text);font-size:13px;cursor:pointer}
.sm.del{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--text)}
.sw input{width:20px;height:20px}
.msg{margin-top:12px;font-size:14px;word-break:break-all}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.msg a{color:var(--ok)}
.pi{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pi:first-of-type{border-top:0}
.pi b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi small{color:var(--mute);font-size:12px}
.pi .acts{display:flex;gap:6px;flex:none}
.cnt{float:right;font-size:12px;color:var(--mute);margin-top:-22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><i>&lt;/&gt;</i>ScriptVault <span class="tag">ADMIN</span></div>
    <a id="siteLink" href="./">View site ↗</a>
  </div>

  <!-- CONNECTION -->
  <div class="card" id="connCard">
    <div id="connOk" class="row hide">
      <span class="dot"></span>
      <div class="grow"><b id="connName" style="font-size:14px"></b><div class="mute">Connected — only you can publish</div></div>
      <button class="sm" id="changeBtn">Change</button>
    </div>
    <div id="connForm">
      <h2>🔑 Connect your GitHub</h2>
      <label>Personal access token</label>
      <input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
      <div class="two">
        <div><label>GitHub username</label><input type="text" id="owner" autocapitalize="off"></div>
        <div><label>Repository</label><input type="text" id="repo" autocapitalize="off"></div>
      </div>
      <label>Site URL</label>
      <input type="text" id="site" autocapitalize="off">
      <button class="btn" id="connect">Connect</button>
      <div class="msg" id="connMsg"></div>
    </div>
  </div>

  <!-- PUBLISH -->
  <div class="card hide" id="pubCard">
    <h2>✍️ New script</h2>
    <label>Title</label>
    <input type="text" id="title" placeholder="e.g. Auto farm script">
    <label>Language</label>
    <select id="lang">
      <option>text</option><option>lua</option><option>javascript</option><option>python</option>
      <option>bash</option><option>html</option><option>css</option><option>java</option><option>c++</option><option>json</option>
    </select>
    <label>Code <span id="chars" class="mute" style="float:right"></span></label>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Paste your script here…"></textarea>
    <label class="sw"><input type="checkbox" id="listed" checked> Show on the public home page</label>
    <button class="btn" id="pub">Publish</button>
    <div class="msg" id="pubMsg"></div>
  </div>

  <!-- LIST -->
  <div class="card hide" id="listCard">
    <h2>📚 Your scripts</h2>
    <div id="plist" class="mute">Loading…</div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cfg = { owner: "", repo: "", token: "", site: "" };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem("sv_cfg") || "{}")); } catch (e) {}

  // auto-fill from the page address
  if (!cfg.owner && /github\.io$/.test(location.hostname)) cfg.owner = location.hostname.split(".")[0];
  if (!cfg.repo) cfg.repo = location.pathname.split("/")[1] || "";
  if (!cfg.site) cfg.site = location.origin + location.pathname.replace(/admin\.html.*$/, "");
  ["token", "owner", "repo", "site"].forEach(function (k) { $(k).value = cfg[k] || ""; });
  $("siteLink").href = cfg.site || "./";

  function say(el, text, type) { el.className = "msg " + (type || ""); el.textContent = text; }
  var enc = function (s) { return btoa(unescape(encodeURIComponent(s))); };
  var dec = function (b) { return decodeURIComponent(escape(atob(b.replace(/\n/g, "")))); };

  async function gh(path, method, body) {
    var r = await fetch("https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/" + path, {
      method: method || "GET", cache: "no-store",
      headers: { Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json" },
      body: body ? JSON.stringify(body) : undefined
    });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) { var e = new Error(j.message || r.status); e.status = r.status; throw e; }
    return j;
  }
  async function readIndex() {
    try { var j = await gh("contents/pastes/index.json"); return { sha: j.sha, list: JSON.parse(dec(j.content)) }; }
    catch (e) { if (e.status === 404) return { sha: null, list: [] }; throw e; }
  }
  function writeIndex(list, sha, msg) {
    var b = { message: msg, content: enc(JSON.stringify(list, null, 1)) };
    if (sha) b.sha = sha;
    return gh("contents/pastes/index.json", "PUT", b);
  }

  /* ---- connect ---- */
  function showConnected() {
    $("connForm").classList.add("hide");
    $("connOk").classList.remove("hide");
    $("connName").textContent = cfg.owner + " / " + cfg.repo;
    $("pubCard").classList.remove("hide");
    $("listCard").classList.remove("hide");
    $("siteLink").href = cfg.site;
    loadList();
  }
  $("connect").onclick = async function () {
    cfg.token = $("token").value.trim(); cfg.owner = $("owner").value.trim();
    cfg.repo = $("repo").value.trim(); cfg.site = $("site").value.trim();
    if (cfg.site && cfg.site.slice(-1) !== "/") cfg.site += "/";
    if (!cfg.token || !cfg.owner || !cfg.repo || !cfg.site) return say($("connMsg"), "Fill every box.", "bad");
    say($("connMsg"), "Checking…");
    try {
      var j = await gh("");
      if (!j.permissions || !j.permissions.push) throw new Error("Token has no write access. Set Contents → Read and write.");
      try { localStorage.setItem("sv_cfg", JSON.stringify(cfg)); } catch (e) {}
      say($("connMsg"), ""); showConnected();
    } catch (e) {
      say($("connMsg"), e.status === 404 ? "Repo not found, or token has no access to it. Check username and repo name." : e.status === 401 ? "Token is wrong or expired. Make a new one." : e.message, "bad");
    }
  };
  $("changeBtn").onclick = function () {
    $("connForm").classList.remove("hide"); $("connOk").classList.add("hide");
    $("pubCard").classList.add("hide"); $("listCard").classList.add("hide");
  };

  /* ---- publish ---- */
  $("code").addEventListener("input", function () { $("chars").textContent = this.value.length + " chars"; });
  function rid() {
    var c = "abcdefghijklmnopqrstuvwxyz0123456789", s = "", a = new Uint8Array(8);
    crypto.getRandomValues(a); for (var i = 0; i < 8; i++) s += c[a[i] % c.length]; return s;
  }
  $("pub").onclick = async function () {
    var btn = this, code = $("code").value;
    if (!code.trim()) return say($("pubMsg"), "Code is empty.", "bad");
    var id = rid();
    var meta = { id: id, title: $("title").value.trim() || "Untitled", lang: $("lang").value, date: new Date().toISOString().slice(0, 10), listed: $("listed").checked };
    btn.disabled = true; say($("pubMsg"), "Publishing…");
    try {
      await gh("contents/pastes/" + id + ".json", "PUT", { message: "Add paste " + id, content: enc(JSON.stringify({ title: meta.title, lang: meta.lang, date: meta.date, code: code })) });
      var ix = await readIndex();
      ix.list.unshift(meta);
      await writeIndex(ix.list, ix.sha, "Index: add " + id);
      var link = cfg.site + "?id=" + id;
      $("pubMsg").className = "msg ok"; $("pubMsg").innerHTML = "";
      $("pubMsg").append("✅ Published. Goes live in about a minute:\n");
      var a = document.createElement("a"); a.href = link; a.textContent = link; $("pubMsg").append(document.createElement("br"), a);
      var cp = document.createElement("button"); cp.className = "sm"; cp.style.marginTop = "10px"; cp.style.display = "block"; cp.textContent = "Copy link";
      cp.onclick = function () { navigator.clipboard.writeText(link); cp.textContent = "Copied ✓"; };
      $("pubMsg").append(cp);
      $("code").value = ""; $("title").value = ""; $("chars").textContent = "";
      loadList();
    } catch (e) { say($("pubMsg"), "Failed: " + e.message, "bad"); }
    btn.disabled = false;
  };

  /* ---- list / delete ---- */
  async function loadList() {
    var box = $("plist"); box.className = "mute"; box.textContent = "Loading…";
    try {
      var ix = await readIndex(); box.innerHTML = "";
      if (!ix.list.length) { box.textContent = "Nothing published yet."; return; }
      ix.list.forEach(function (p) {
        var row = document.createElement("div"); row.className = "pi";
        var g = document.createElement("div"); g.className = "grow";
        var b = document.createElement("b"); b.textContent = p.title;
        var s = document.createElement("small"); s.textContent = p.lang + " · " + p.date + (p.listed === false ? " · unlisted" : "");
        g.append(b, s);
        var acts = document.createElement("div"); acts.className = "acts";
        var c = document.createElement("button"); c.className = "sm"; c.textContent = "Link";
        c.onclick = function () { navigator.clipboard.writeText(cfg.site + "?id=" + p.id); c.textContent = "Copied"; setTimeout(function () { c.textContent = "Link"; }, 1500); };
        var d = document.createElement("button"); d.className = "sm del"; d.textContent = "Delete";
        d.onclick = function () { removePaste(p, d); };
        acts.append(c, d); row.append(g, acts); box.append(row);
      });
    } catch (e) { box.textContent = "Could not load list: " + e.message; }
  }
  async function removePaste(p, btn) {
    if (!confirm("Delete \"" + p.title + "\"?")) return;
    btn.disabled = true; btn.textContent = "…";
    try {
      try { var f = await gh("contents/pastes/" + p.id + ".json"); await gh("contents/pastes/" + p.id + ".json", "DELETE", { message: "Delete paste " + p.id, sha: f.sha }); }
      catch (e) { if (e.status !== 404) throw e; }
      var ix = await readIndex();
      await writeIndex(ix.list.filter(function (x) { return x.id !== p.id; }), ix.sha, "Index: remove " + p.id);
      loadList();
    } catch (e) { alert("Delete failed: " + e.message); btn.disabled = false; btn.textContent = "Delete"; }
  }

  // auto-connect if a token is already saved
  if (cfg.token) $("connect").click();
})();
</script>
</body>
</html>
