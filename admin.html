<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
  body { margin:0; background:#0f1115; color:#e6e8ee; font-family:system-ui,sans-serif; padding:16px; }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:20px; }
  label { display:block; margin:12px 0 4px; font-size:13px; color:#8b93a7; }
  input, textarea, select { width:100%; padding:10px; border-radius:8px; border:1px solid #2a2f3a; background:#0b0d11; color:#e6e8ee; font-size:15px; }
  textarea { min-height:260px; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; }
  button { background:#6c8cff; color:#fff; border:0; border-radius:8px; padding:12px 18px; font-size:15px; margin-top:14px; }
  .out { margin-top:14px; word-break:break-all; color:#7dffb0; }
  .err { color:#ff7a7a; }
  .card { background:#181b22; border:1px solid #2a2f3a; border-radius:12px; padding:14px; margin-bottom:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin – publish a script</h1>

  <div class="card">
    <label>GitHub username</label>
    <input id="owner" placeholder="yourname">
    <label>Repository name</label>
    <input id="repo" placeholder="script-vault">
    <label>Personal access token (stays only in this browser)</label>
    <input id="token" type="password" placeholder="github_pat_...">
    <label>Site URL (where the site is hosted)</label>
    <input id="site" placeholder="https://yourname.github.io/script-vault/">
    <button id="save">Save settings</button>
  </div>

  <div class="card">
    <label>Title</label>
    <input id="title" placeholder="My script">
    <label>Language</label>
    <select id="lang">
      <option>text</option><option>javascript</option><option>python</option>
      <option>lua</option><option>bash</option><option>html</option><option>css</option><option>java</option><option>c++</option>
    </select>
    <label>Code</label>
    <textarea id="code" spellcheck="false"></textarea>
    <button id="pub">Publish</button>
    <div id="out" class="out"></div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  ["owner", "repo", "token", "site"].forEach(function (k) {
    try { $(k).value = localStorage.getItem("sv_" + k) || ""; } catch (e) {}
  });

  $("save").onclick = function () {
    ["owner", "repo", "token", "site"].forEach(function (k) {
      try { localStorage.setItem("sv_" + k, $(k).value.trim()); } catch (e) {}
    });
    $("out").textContent = "Settings saved.";
  };

  function rid() {
    var c = "abcdefghijklmnopqrstuvwxyz0123456789", s = "";
    var arr = new Uint8Array(8);
    crypto.getRandomValues(arr);
    for (var i = 0; i < 8; i++) s += c[arr[i] % c.length];
    return s;
  }

  $("pub").onclick = async function () {
    var out = $("out");
    var owner = $("owner").value.trim(), repo = $("repo").value.trim();
    var token = $("token").value.trim(), site = $("site").value.trim();
    var code = $("code").value;
    if (!owner || !repo || !token || !site) { out.innerHTML = '<span class="err">Fill and save settings first.</span>'; return; }
    if (!code.trim()) { out.innerHTML = '<span class="err">Code is empty.</span>'; return; }

    var id = rid();
    var data = {
      title: $("title").value.trim() || "Untitled",
      lang: $("lang").value,
      date: new Date().toISOString().slice(0, 10),
      code: code
    };
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    out.textContent = "Publishing…";

    try {
      var r = await fetch("https://api.github.com/repos/" + owner + "/" + repo + "/contents/pastes/" + id + ".json", {
        method: "PUT",
        headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" },
        body: JSON.stringify({ message: "Add paste " + id, content: content })
      });
      if (!r.ok) throw new Error((await r.json()).message || r.status);
      if (site.slice(-1) !== "/") site += "/";
      var link = site + "?id=" + id;
      out.innerHTML = 'Published! Live in ~1 minute:<br><a style="color:#7dffb0" href="' + link + '">' + link + '</a>';
      $("code").value = "";
    } catch (e) {
      out.innerHTML = '<span class="err">Failed: ' + e.message + '</span>';
    }
  };
})();
</script>
</body>
</html>
